name: Deploy to PythonAnywhere

# Pushing to main uploads the code to PythonAnywhere and reloads the live web app.
# The data/ database and uploads/ images are intentionally NOT in git, so a deploy can
# never overwrite the live database or the uploaded images.
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   PA_USERNAME  - PythonAnywhere username
#   PA_API_TOKEN - PythonAnywhere -> Account -> API token
#   PA_DOMAIN     - e.g. username.pythonanywhere.com
#
# The API lives on www.pythonanywhere.com (eu. for EU accounts) - api.pythonanywhere.com
# is a parked page that answers 404 to everything, which made earlier deploys report
# success while uploading nothing. Every call here checks its HTTP status, the web app
# folder is read from the web app's own configuration, and one file is read back and
# compared with the commit before the site is reloaded.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
    group: pythonanywhere-deploy
    cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload code, reload the live web app, verify it answers
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_DOMAIN: ${{ secrets.PA_DOMAIN }}
          # Optional password-reset email settings. SMTP_PASSWORD is the Gmail App Password;
          # the sender defaults to the salon's Gmail address and can be overridden. Values
          # are masked by GitHub and are never echoed by this workflow.
          SMTP_PASSWORD_VALUE: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PASSWORD_ALT1: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_PASSWORD_ALT2: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_PASSWORD_ALT3: ${{ secrets.GMAIL_PASSWORD }}
          SMTP_PASSWORD_ALT4: ${{ secrets.APP_PASSWORD }}
          # Repository *variables* are not masked in logs, so they are only a last-resort
          # fallback for a value that was saved on the Variables tab by mistake. The value is
          # never printed either way, and the run reports which tab it came from.
          SMTP_PASSWORD_VAR: ${{ vars.SMTP_PASSWORD }}
          SMTP_APP_PASSWORD_VAR: ${{ vars.SMTP_APP_PASSWORD }}
          GMAIL_APP_PASSWORD_VAR: ${{ vars.GMAIL_APP_PASSWORD }}
          SMTP_USERNAME_VALUE: ${{ secrets.SMTP_USERNAME }}
          SMTP_HOST_VALUE: ${{ secrets.SMTP_HOST }}
          SMTP_PORT_VALUE: ${{ secrets.SMTP_PORT }}
          SMTP_FROM_VALUE: ${{ secrets.SMTP_FROM }}
        run: |
          set -euo pipefail

          if [ -z "${PA_USERNAME:-}" ] || [ -z "${PA_API_TOKEN:-}" ] || [ -z "${PA_DOMAIN:-}" ]; then
            echo "::error title=Deploy skipped::PA_USERNAME / PA_API_TOKEN / PA_DOMAIN are not set as repository secrets - no files were uploaded and the live site is unchanged."
            exit 1
          fi

          AUTH=(-H "Authorization: token ${PA_API_TOKEN}")
          HOME_DIR="/home/${PA_USERNAME}"

          # 1. Pick the API host this account lives on (US or EU).
          API_HOST=""
          for h in www eu; do
            code=$(curl -sS -o /tmp/tree_probe.json -w '%{http_code}' "${AUTH[@]}" \
                   "https://${h}.pythonanywhere.com/api/v0/user/${PA_USERNAME}/files/tree/?path=${HOME_DIR}" || true)
            echo "files/tree on ${h}.pythonanywhere.com -> HTTP ${code}"
            if [ "${code}" = "200" ]; then
              API_HOST="${h}.pythonanywhere.com"
              break
            fi
          done
          if [ -z "${API_HOST}" ]; then
            echo "::error title=PythonAnywhere API not reachable::Neither www nor eu accepted the PA_API_TOKEN for this username (last status ${code}). Regenerate the token (Account -> API token) and update the repository secret."
            exit 1
          fi
          echo "using API host ${API_HOST}"
          echo "::notice title=PythonAnywhere API::host=${API_HOST}, account home answered 200"
          API="https://${API_HOST}/api/v0"
          BASE="${API}/user/${PA_USERNAME}"

          # 2. Ask the web app where its code lives, then fall back to the usual folder
          #    names and whatever is in the account home.
          curl -sS "${AUTH[@]}" -o /tmp/webapp.json "${BASE}/webapps/${PA_DOMAIN}/" || true
          curl -sS "${AUTH[@]}" -o /tmp/home.json "${BASE}/files/tree/?path=${HOME_DIR}" || true
          echo "webapp config head: $(head -c 300 /tmp/webapp.json)"
          echo "home tree head: $(head -c 300 /tmp/home.json)"

          cat > /tmp/discover.py <<'PY'
          import json, sys
          home = sys.argv[1]
          names = []

          def add(path):
              path = str(path or "").strip().rstrip("/")
              if not path:
                  return
              rest = path[len(home) + 1:] if path.startswith(home + "/") else path.lstrip("/")
              if rest and "/" not in rest:
                  names.append(rest)

          try:
              cfg = json.load(open("/tmp/webapp.json", encoding="utf-8", errors="replace"))
          except Exception:
              cfg = {}
          if isinstance(cfg, dict):
              add(cfg.get("source_directory"))

          try:
              tree = json.load(open("/tmp/home.json", encoding="utf-8", errors="replace"))
          except Exception:
              tree = []
          if isinstance(tree, dict):
              tree = tree.get("files") or tree.get("entries") or []
          for entry in tree if isinstance(tree, list) else []:
              if isinstance(entry, dict):
                  add(entry.get("path") or entry.get("name"))
              else:
                  add(entry)

          out = []
          for n in names:
              if n not in out:
                  out.append(n)
          sys.stdout.write("\n".join(out))
          PY
          mapfile -t discovered < <(python3 /tmp/discover.py "${HOME_DIR}" || true)

          candidates=("${discovered[@]:-}" "Blonde-Majestic-Salone" "${PA_DOMAIN}")
          echo "candidate folders: ${candidates[*]:-none}"

          REMOTE=""
          report=""
          for name in "${candidates[@]}"; do
            [ -n "$name" ] || continue
            dir="${HOME_DIR}/${name}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" "${BASE}/files/path${dir}/public/css/styles.css" || true)
            report="${report}${name}:css=${code} "
            if [ "${code}" = "200" ]; then
              REMOTE="${dir}"
              break
            fi
          done
          echo "discovery -> ${report}"
          echo "::notice title=Web app folder::${report}"

          if [ -z "${REMOTE}" ]; then
            echo "::error title=No folder holds this project::None of the candidate folders contains public/css/styles.css. The project may live in a subfolder the web app config does not expose."
            exit 1
          fi
          echo "deploying to ${REMOTE}"

          # 3. Production environment for the live site (non-secret configuration only).
          #    Uploaded only when absent, so anything added later on the host is preserved.
          code=$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" "${BASE}/files/path${REMOTE}/.env" || true)
          echo "existing .env -> HTTP ${code}"
          case "${code}" in
            200)
              echo "keeping the existing .env on the server"
              echo "::notice title=Server .env::already present, left untouched" ;;
            404)
              printf 'SECURE_COOKIES=1\nTZ_OFFSET_HOURS=4\n' > /tmp/production.env
              up=$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" -F "content=@/tmp/production.env" \
                    "${BASE}/files/path${REMOTE}/.env" || true)
              echo "create .env -> HTTP ${up}"
              case "${up}" in
                200|201|204) echo "created production .env" ;;
                *)
                  echo "::error title=Could not create .env::POST ${REMOTE}/.env returned HTTP ${up}"
                  exit 1 ;;
              esac ;;
            *)
              echo "::warning title=Unexpected .env response::HTTP ${code}" ;;
          esac

          # 2c. When the Gmail App Password is provided as a repository secret, write the email
          #     settings into the server .env for you. Other lines are preserved, existing
          #     SMTP_* lines are replaced so this is idempotent, and no value is ever echoed -
          #     only the secret's name and length are reported. The secret is accepted under
          #     SMTP_PASSWORD or a common alternative name, and Google's display spaces are
          #     stripped, because a pasted "abcd efgh ijkl mnop" would fail to authenticate.
          smtp_pw_v="${SMTP_PASSWORD_VALUE:-}"; smtp_pw_src="SMTP_PASSWORD"
          for alt in "SMTP_APP_PASSWORD:${SMTP_PASSWORD_ALT1:-}" "GMAIL_APP_PASSWORD:${SMTP_PASSWORD_ALT2:-}" "GMAIL_PASSWORD:${SMTP_PASSWORD_ALT3:-}" "APP_PASSWORD:${SMTP_PASSWORD_ALT4:-}" "SMTP_PASSWORD (repository variable):${SMTP_PASSWORD_VAR:-}" "SMTP_APP_PASSWORD (repository variable):${SMTP_APP_PASSWORD_VAR:-}" "GMAIL_APP_PASSWORD (repository variable):${GMAIL_APP_PASSWORD_VAR:-}"; do
            alt_name="${alt%%:*}"; alt_val="${alt#*:}"
            if [ -z "${smtp_pw_v}" ] && [ -n "${alt_val}" ]; then
              smtp_pw_v="${alt_val}"; smtp_pw_src="${alt_name}"
            fi
          done
          smtp_pw_v="$(printf '%s' "${smtp_pw_v}" | tr -d '[:space:]')"
          if [ -z "${smtp_pw_v}" ]; then
            echo "no password-reset email secret is visible to this workflow - the server .env is unchanged"
            echo "::notice title=SMTP secret::not found - no value in repository secrets named SMTP_PASSWORD, SMTP_APP_PASSWORD, GMAIL_APP_PASSWORD, GMAIL_PASSWORD or APP_PASSWORD, and none in the variables SMTP_PASSWORD, SMTP_APP_PASSWORD or GMAIL_APP_PASSWORD, so the .env was left alone"
          else
            echo "using the ${smtp_pw_src} secret (${#smtp_pw_v} characters, not printed)"
            echo "::notice title=SMTP secret::found as ${smtp_pw_src}, ${#smtp_pw_v} characters after removing spaces - writing the email settings to the server .env"
            smtp_user_v="${SMTP_USERNAME_VALUE:-jonasconcepcion2023@gmail.com}"
            smtp_host_v="${SMTP_HOST_VALUE:-smtp.gmail.com}"
            smtp_port_v="${SMTP_PORT_VALUE:-587}"
            smtp_from_v="${SMTP_FROM_VALUE:-${smtp_user_v}}"
            curl -sS "${AUTH[@]}" -o /tmp/live.env "${BASE}/files/path${REMOTE}/.env" || true
            {
              grep -vE '^[[:space:]]*SMTP_(HOST|PORT|USERNAME|PASSWORD|FROM|USE_TLS)[[:space:]]*=' /tmp/live.env 2>/dev/null || true
              printf 'SMTP_HOST=%s\n' "${smtp_host_v}"
              printf 'SMTP_PORT=%s\n' "${smtp_port_v}"
              printf 'SMTP_USERNAME=%s\n' "${smtp_user_v}"
              printf 'SMTP_PASSWORD=%s\n' "${smtp_pw_v}"
              printf 'SMTP_FROM=%s\n' "${smtp_from_v}"
              printf 'SMTP_USE_TLS=%s\n' "${SMTP_USE_TLS_VALUE:-1}"
            } > /tmp/live.env.new
            up=$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" -F "content=@/tmp/live.env.new" \
                  "${BASE}/files/path${REMOTE}/.env" || true)
            case "${up}" in
              200|201|204)
                echo "wrote the password-reset email settings to ${REMOTE}/.env (values not printed)"
                echo "::notice title=Password-reset email::settings written to the server .env from repository secrets (host=${smtp_host_v}, port=${smtp_port_v}) - values never printed" ;;
              *)
                echo "::error title=Could not write SMTP settings::POST ${REMOTE}/.env returned HTTP ${up}"
                exit 1 ;;
            esac
            unset smtp_pw_v SMTP_PASSWORD_VALUE SMTP_PASSWORD_ALT1 SMTP_PASSWORD_ALT2 SMTP_PASSWORD_ALT3 SMTP_PASSWORD_ALT4 SMTP_PASSWORD_VAR SMTP_APP_PASSWORD_VAR GMAIL_APP_PASSWORD_VAR
          fi

          # 3a. Report the live email settings. Names only for anything that could carry a
          #     credential; SMTP_HOST/PORT/USE_TLS are printed because they are not secret.
          #     Leading whitespace and CRLF endings are tolerated - the app strips both, so a
          #     stricter check here would wrongly report a usable .env as unconfigured.
          curl -sS "${AUTH[@]}" -o /tmp/live.env "${BASE}/files/path${REMOTE}/.env" || true
          env_val() { sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" /tmp/live.env 2>/dev/null | head -1 | tr -d '\r'; }
          env_set() { [ -n "$(env_val "$1")" ]; }
          present=""; absent=""
          for k in SECURE_COOKIES PUBLIC_BASE_URL SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM SMTP_USE_TLS; do
            if env_set "$k"; then
              present="${present} ${k}"
            else
              absent="${absent} ${k}"
            fi
          done
          mail_host="$(env_val SMTP_HOST)"; mail_port="$(env_val SMTP_PORT)"; mail_tls="$(env_val SMTP_USE_TLS)"
          echo "live .env - set:${present:- none} - unset:${absent:- none}"
          echo "SMTP host=${mail_host:-none} port=${mail_port:-none} starttls=${mail_tls:-none}"
          if env_set SMTP_HOST && env_set SMTP_USERNAME && env_set SMTP_PASSWORD && env_set SMTP_FROM; then
            echo "password-reset email: configured on the server (host=${mail_host}, port=${mail_port:-587}, starttls=${mail_tls:-1})"
            echo "::notice title=Password-reset email::configured (host=${mail_host}, port=${mail_port:-587}) - reset requests will send a real email"
          else
            echo "password-reset email: NOT configured (unset:${absent:- none})"
            echo "::notice title=Password-reset email::NOT configured (unset:${absent:- none}) - reset requests are answered but no email is sent"
            # Diagnostic for a save that landed elsewhere. Names and counts only, surfaced
            # as annotations so it is readable from the run without the job log.
            diag_keys=$(sed -n 's/^[[:space:]]*\([A-Za-z_][A-Za-z0-9_]*\)[[:space:]]*=.*/\1/p' /tmp/live.env 2>/dev/null | sort -u | tr '\n' ' ')
            diag_bytes=$(wc -c < /tmp/live.env 2>/dev/null || echo 0)
            diag_lines=$(wc -l < /tmp/live.env 2>/dev/null || echo 0)
            echo "live .env keys: ${diag_keys:-none} (${diag_bytes} bytes, ${diag_lines} lines)"
            echo "::notice title=Live .env contents::keys present:${diag_keys:- none} (${diag_bytes} bytes, ${diag_lines} lines) - values are never printed"
            others=""
            for p in "${HOME_DIR}/.env" "${REMOTE}/env" "${REMOTE}/.env.txt" "${REMOTE}/smtp.env" "${REMOTE}/mail.env"; do
              c=$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" "${BASE}/files/path${p}" || true)
              others="${others} ${p}=${c}"
            done
            echo "other env files:${others}"
            echo "::notice title=Other env files::${others}"
          fi

          # 3b. Reset links must be built from a fixed origin, not from the request Host,
          #     so a crafted Host header can never point a password-reset email elsewhere.
          if ! grep -q "^PUBLIC_BASE_URL=..*" /tmp/live.env 2>/dev/null; then
            printf '\nPUBLIC_BASE_URL=https://%s\n' "${PA_DOMAIN}" >> /tmp/live.env
            up=$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" -F "content=@/tmp/live.env" \
                  "${BASE}/files/path${REMOTE}/.env" || true)
            case "${up}" in
              200|201|204)
                echo "added PUBLIC_BASE_URL=https://${PA_DOMAIN} to the server .env"
                echo "::notice title=PUBLIC_BASE_URL::added https://${PA_DOMAIN} to the server .env (existing settings kept)" ;;
              *)
                echo "::warning title=Could not set PUBLIC_BASE_URL::HTTP ${up} - reset links fall back to the request Host" ;;
            esac
          fi

          # 4. Upload every tracked file. data/ and uploads/ are gitignored, so the live
          #    database and uploaded images are never touched by a deploy.
          count=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            up=$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" -F "content=@${f}" \
                  "${BASE}/files/path${REMOTE}/${f}" || true)
            case "${up}" in
              200|201|204) ;;
              401|403)
                echo "::error title=Upload rejected::${f} -> HTTP ${up}. The PA_API_TOKEN is not accepted."
                exit 1 ;;
              *)
                echo "::error title=Upload failed::${f} -> HTTP ${up}"
                exit 1 ;;
            esac
            count=$((count + 1))
            sleep 2   # stay under the API's 40 requests/minute rate limit
          done < <(git ls-files)
          echo "uploaded ${count} files"
          echo "::notice title=Upload complete::${count} files accepted by the PythonAnywhere API"

          # 5. Read one file back and compare: proves the code landed where the site serves it.
          curl -sS "${AUTH[@]}" -o /tmp/verify.css "${BASE}/files/path${REMOTE}/public/css/styles.css" || true
          if cmp -s /tmp/verify.css public/css/styles.css; then
            echo "round-trip verified: public/css/styles.css matches the commit"
          else
            echo "::error title=Uploaded code not visible on the server::public/css/styles.css differs from this commit after upload - the web app serves a different directory than ${REMOTE}."
            exit 1
          fi

          reload=$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" -X POST "${BASE}/webapps/${PA_DOMAIN}/reload/" || true)
          echo "reload ${PA_DOMAIN} -> HTTP ${reload}"
          echo "reload requested, waiting for the site..."

          status="none"
          for i in $(seq 1 36); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://${PA_DOMAIN}/api/public" || true)
            if [ "$status" = "200" ]; then
              echo "live: https://${PA_DOMAIN} answered 200"
              break
            fi
            sleep 5
          done

          if [ "${status}" != "200" ]; then
            echo "::error title=Site did not answer after reload::https://${PA_DOMAIN}/api/public returned ${status} (reload HTTP ${reload})"
            exit 1
          fi

          # 6. A reset email that fails to send writes one line (time, SMTP host, exception
          #    type - never a token, body or credential) to data/mail.log. Printing its tail
          #    makes an SMTP login problem diagnosable here instead of in the PA console.
          code=$(curl -sS -o /tmp/mail.log -w '%{http_code}' "${AUTH[@]}" "${BASE}/files/path${REMOTE}/data/mail.log" || true)
          if [ "${code}" = "200" ]; then
            echo "recent password-reset email failures (newest last):"
            tail -n 5 /tmp/mail.log | tr -d '\r'
            echo "::notice title=Password-reset email failures::$(tail -n 1 /tmp/mail.log | tr -d '\r')"
          else
            echo "no data/mail.log on the server - no reset email has failed to send"
          fi

          exit 0
